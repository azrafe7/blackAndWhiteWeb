<!DOCTYPE html>
<html>
  <head>
    <title>Black & White Web Options</title>
    <meta charset='UTF-8' />
    <style>
      body {
        font-family: sans-serif;
      }

      label {
        display: inline;
      }

      textarea {
        font-family: monospace;
      }

      .message {
        height: 20px;
        background: #333;
        color: #fff;
        padding: 5px;
        padding-top: 10px;
      }
      
      .checkboxes input, .checkboxes label {
        vertical-align: middle;
      }
      
      .checkboxes textarea {
        margin-left: 22px;
        min-width: 350px;
        min-height: 5em;
      }
      
      #filter_tester_link {
        font-size: .8em;
      }
      .checkboxes textarea {
        margin-bottom: 5px;
        margin-top: 2px;
      }

      button {
        margin-top: 5px;
      }
      
      input[type=checkbox], label, summary, button {
        cursor: pointer;
      }
      
      .underlined {
        text-decoration: underline;
      }
    </style>
  </head>

  <body>
    <div class="message"></div>
    <h3>Black & White Web <span id="version"></span> Options</h3>

    <div class="checkboxes">
      <input type="checkbox" id="always_on" />
      <label for="always_on" title="Automatically enable Black & White Web on new opened pages">Always ON</label>
      <br />
      <input type="checkbox" id="animate" />
      <label for="animate" title="Animate transition to Black & White">Animate</label>
      <br />
      <br />
      
      <div id="lists">
        <input type="checkbox" id="whitelist" />
        <label for="whitelist" title="When Always ON, only auto-start the extension on urls containing this text"><span class="underlined">Always ON</span> &bull; White List</label>
        <br />
        <textarea id="whitelist-textarea" placeholder="e.g.:
youtube.com
news.ycombinator.com"></textarea>
        <br />
        <input type="checkbox" id="blacklist" />
        <label for="blacklist" title="When Always ON, don't auto-start the extension on urls containing this text"><span class="underlined">Always ON</span> &bull; Black List</label>
        <br />
        <textarea id="blacklist-textarea" placeholder="e.g.:
stackoverflow.com
mail.google.com"></textarea>
        <br />
      </div>

      <br />
      <details>
        <summary>⚠️ Advanced Settings</summary>
        <br />
        <input type="checkbox" id="override-filter" />
        <label for="override-filter" title="Override default CSS filter">⚠️ CSS Filter Override</label>
        <br />
        <textarea id="override-filter-textarea" placeholder="e.g.:
invert(1)
url(#my-filter)"></textarea>
        <br />
        <input type="checkbox" id="svg-filter" />
        <label for="svg-filter" title="Inject SVG filter">⚠️ Inject SVG Filter</label>
        <br />
        <textarea id="svg-filter-textarea" placeholder="e.g.:
<filter id='my-filter'>
  <feGaussianBlur stdDeviation='5'/>
</filter>"></textarea>
        <br />
        <div id="filter_tester_link">
          <a href="https://azrafe7.github.io/filter_tester/filter_tester.html" target="_blank">Open external filter tester page</a>
        </div>
      </details>

    </div>
    <br />
    <button class="submit" title="Save settings">Save</button>
    <button class="reset" title="Reset settings to defaults">Reset</button>
    <button class="reload" title="Reload last saved settings">Reload</button>
    <!--button class="check">Check</button-->

    <script src="options.js"></script>
  </body>
</html>
